<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Sorpresa</title>
    <!-- Solo A-Frame, sin librerías de AR extras -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
      }

      /* Aquí está la magia: el video de la cámara en formato nativo absoluto */
      #camara-fondo {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      /* Nuestro mundo 3D va transparente encima del video */
      #escena-ar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      #pantalla-inicio {
        position: absolute;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #ff4d4d;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- Elemento nativo para la cámara -->
    <video id="camara-fondo" autoplay muted playsinline></video>

    <div id="pantalla-inicio">
      <h2>Tengo algo para ti...</h2>
      <p>Sube el volumen y abre la caja</p>
      <button id="btn-comenzar">Toca aquí para empezar</button>
    </div>

    <div id="escena-ar">
      <!-- "renderer=alpha: true" hace que A-Frame sea transparente y deje ver la cámara atrás -->
      <a-scene renderer="alpha: true" vr-mode-ui="enabled: false">
        <a-assets>
          <img id="foto1" src="./assets/1.png" />
          <img id="foto2" src="./assets/2.png" />
          <img id="foto3" src="./assets/3.png" />
          <img id="foto4" src="./assets/4.png" />
          <img id="foto5" src="./assets/5.png" />
          <img id="foto6" src="./assets/6.png" />
          <img id="foto7" src="./assets/7.png" />
          <img id="foto8" src="./assets/8.png" />
          <img id="foto9" src="./assets/9.png" />
          <img id="foto10" src="./assets/10.png" />
          <img id="foto11" src="./assets/11.png" />
          <img id="foto12" src="./assets/12.png" />
          <img id="foto13" src="./assets/13.png" />
          <img id="foto14" src="./assets/14.png" />
          <img id="foto15" src="./assets/15.png" />
          <img id="foto16" src="./assets/16.png" />
          <img id="foto17" src="./assets/17.png" />
          <img id="foto18" src="./assets/18.png" />
          <img id="foto19" src="./assets/19.png" />
          <img id="foto20" src="./assets/20.png" />
          <img id="foto21" src="./assets/21.png" />
          <img id="foto22" src="./assets/22.png" />
          <img id="foto23" src="./assets/23.png" />
          <img id="foto24" src="./assets/24.png" />
          <img id="ping-saluda" src="./assets/wavingPenguin.png" />
          <img id="ping-apunta" src="./assets/pointingPenguin.png" />
          <img id="ping-novia" src="./assets/cardPenguin.png" />
          <audio
            id="cancion"
            src="./assets/nuevequince.mp3"
            preload="auto"
          ></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls></a-camera>

        <a-entity id="carrusel" visible="false">
          <!-- ========================================== -->
          <!-- ANILLO CENTRAL (A la altura de la vista)   -->
          <!-- ========================================== -->
          <!-- Lic. Hielos al frente en el centro -->
          <a-image
            id="pinguino-guia"
            src="#ping-saluda"
            position="0 0 -3.5"
            width="2"
            height="2"
          ></a-image>

          <!-- 7 fotos rodeando los lados y la espalda -->
          <a-entity rotation="0 45 0"
            ><a-image
              src="#foto1"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 90 0"
            ><a-image
              src="#foto2"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 135 0"
            ><a-image
              src="#foto3"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 180 0"
            ><a-image
              src="#foto4"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 225 0"
            ><a-image
              src="#foto5"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 270 0"
            ><a-image
              src="#foto6"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 315 0"
            ><a-image
              src="#foto7"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>

          <!-- ========================================== -->
          <!-- ANILLO SUPERIOR (45 grados hacia arriba)   -->
          <!-- ========================================== -->
          <!-- Nota el "45" en el primer valor de rotation -->
          <a-entity rotation="45 0 0"
            ><a-image
              src="#foto8"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="45 45 0"
            ><a-image
              src="#foto9"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="45 90 0"
            ><a-image
              src="#foto10"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="45 135 0"
            ><a-image
              src="#foto11"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="45 180 0"
            ><a-image
              src="#foto12"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="45 225 0"
            ><a-image
              src="#foto13"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="45 270 0"
            ><a-image
              src="#foto14"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="45 315 0"
            ><a-image
              src="#foto15"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>

          <!-- ========================================== -->
          <!-- ANILLO INFERIOR (45 grados hacia abajo)    -->
          <!-- ========================================== -->
          <!-- Nota el "-45" en el primer valor de rotation -->
          <a-entity rotation="-45 0 0"
            ><a-image
              src="#foto16"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="-45 45 0"
            ><a-image
              src="#foto17"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="-45 90 0"
            ><a-image
              src="#foto18"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="-45 135 0"
            ><a-image
              src="#foto19"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="-45 180 0"
            ><a-image
              src="#foto20"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="-45 225 0"
            ><a-image
              src="#foto21"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="-45 270 0"
            ><a-image
              src="#foto22"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="-45 315 0"
            ><a-image
              src="#foto23"
              position="0 0 -3.5"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
        </a-entity>
      </a-scene>
    </div>

    <script src="app.js"></script>
  </body>
</html>
