<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Sorpresa</title>
    <!-- Solo A-Frame, sin librerías de AR extras -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
      }

      /* Aquí está la magia: el video de la cámara en formato nativo absoluto */
      #camara-fondo {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
      }

      /* Nuestro mundo 3D va transparente encima del video */
      #escena-ar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      #pantalla-inicio {
        position: absolute;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #ff4d4d;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- Elemento nativo para la cámara -->
    <video id="camara-fondo" autoplay muted playsinline></video>

    <div id="pantalla-inicio">
      <h2>Tengo algo para ti...</h2>
      <p>Sube el volumen y abre la caja</p>
      <button id="btn-comenzar">Toca aquí para empezar</button>
    </div>

    <div id="escena-ar">
      <!-- "renderer=alpha: true" hace que A-Frame sea transparente y deje ver la cámara atrás -->
      <a-scene renderer="alpha: true" vr-mode-ui="enabled: false">
        <a-assets>
          <img id="foto1" src="./assets/1.png" />
          <img id="foto2" src="./assets/2.png" />
          <img id="foto3" src="./assets/3.png" />
          <img id="foto4" src="./assets/4.png" />
          <img id="foto5" src="./assets/5.png" />
          <img id="foto6" src="./assets/6.png" />
          <img id="foto7" src="./assets/7.png" />
          <img id="ping-saluda" src="./assets/wavingPenguin.png" />
          <img id="ping-apunta" src="./assets/pointingPenguin.png" />
          <img id="ping-novia" src="./assets/cardPenguin.png" />
          <audio
            id="cancion"
            src="./assets/nuevequince.mp3"
            preload="auto"
          ></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls></a-camera>

        <a-entity id="carrusel" visible="false">
          <!-- Pingüino guía a solo 1.5 metros de distancia y mucho más grande -->
          <a-image
            id="pinguino-guia"
            src="#ping-saluda"
            position="0 0 -2"
            width="2"
            height="2"
          ></a-image>

          <!-- Fotos muy de cerca y en formato grande -->
          <a-entity rotation="0 45 0"
            ><a-image
              src="#foto1"
              position="0 0 -2"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 90 0"
            ><a-image
              src="#foto2"
              position="0 0 -2"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 135 0"
            ><a-image
              src="#foto3"
              position="0 0 -2"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 180 0"
            ><a-image
              src="#foto4"
              position="0 0 -2"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 225 0"
            ><a-image
              src="#foto5"
              position="0 0 -2"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 270 0"
            ><a-image
              src="#foto6"
              position="0 0 -2"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
          <a-entity rotation="0 315 0"
            ><a-image
              src="#foto7"
              position="0 0 -2"
              width="2"
              height="2.5"
            ></a-image
          ></a-entity>
        </a-entity>
      </a-scene>
    </div>

    <script src="app.js"></script>
  </body>
</html>
