<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorpresa</title>
    <!-- Usamos A-Frame 1.3.0 que es el más estable con AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #pantalla-inicio {
        position: absolute;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        background-color: #ff4d4d;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      body {
        margin: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      video {
        object-fit: cover !important;
        width: 100vw !important;
        height: 100vh !important;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden">
    <div id="pantalla-inicio">
      <h2>Tengo algo para ti...</h2>
      <p>Sube el volumen y abre la caja</p>
      <button id="btn-comenzar">Toca aquí para empezar</button>
    </div>

    <!-- Escena AR sin marcadores, solo usa la cámara de fondo -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
      vr-mode-ui="enabled: false"
    >
      <a-assets>
        <img id="foto1" src="./assets/1.png" />
        <img id="foto2" src="./assets/2.png" />
        <img id="foto3" src="./assets/3.png" />
        <img id="foto4" src="./assets/4.png" />
        <img id="foto5" src="./assets/5.png" />
        <img id="foto6" src="./assets/6.png" />
        <img id="foto7" src="./assets/7.png" />
        <img id="ping-saluda" src="./assets/wavingPenguin.png" />
        <img id="ping-apunta" src="./assets/pointingPenguin.png" />
        <img id="ping-novia" src="./assets/cardPenguin.png" />
        <audio
          id="cancion"
          src="./assets/nuevequince.mp3"
          preload="auto"
        ></audio>
      </a-assets>

      <!-- Cámara central con giroscopio activado -->
      <a-camera position="0 0 0"></a-camera>

      <!-- El carrusel que la rodeará, oculto hasta que presione Iniciar -->
      <a-entity id="carrusel" visible="false">
        <a-image
          id="pinguino-guia"
          src="#ping-saluda"
          position="0 0 -6"
          width="2"
          height="2"
        ></a-image>

        <a-entity rotation="0 45 0"
          ><a-image
            src="#foto1"
            position="0 0 -6"
            width="2"
            height="2.5"
          ></a-image
        ></a-entity>
        <a-entity rotation="0 90 0"
          ><a-image
            src="#foto2"
            position="0 0 -6"
            width="2"
            height="2.5"
          ></a-image
        ></a-entity>
        <a-entity rotation="0 135 0"
          ><a-image
            src="#foto3"
            position="0 0 -6"
            width="2"
            height="2.5"
          ></a-image
        ></a-entity>
        <a-entity rotation="0 180 0"
          ><a-image
            src="#foto4"
            position="0 0 -6"
            width="2"
            height="2.5"
          ></a-image
        ></a-entity>
        <a-entity rotation="0 225 0"
          ><a-image
            src="#foto5"
            position="0 0 -6"
            width="2"
            height="2.5"
          ></a-image
        ></a-entity>
        <a-entity rotation="0 270 0"
          ><a-image
            src="#foto6"
            position="0 0 -6"
            width="2"
            height="2.5"
          ></a-image
        ></a-entity>
        <a-entity rotation="0 315 0"
          ><a-image
            src="#foto7"
            position="0 0 -6"
            width="2"
            height="2.5"
          ></a-image
        ></a-entity>
      </a-entity>
    </a-scene>

    <script src="app.js"></script>
  </body>
</html>
